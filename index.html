<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        body {
            background: #0a0c12;
            color: #d0d8e2;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 18% 15%, rgba(60, 90, 130, 0.35), transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(90, 60, 130, 0.25), transparent 45%),
                radial-gradient(circle at 50% 100%, rgba(30, 50, 80, 0.4), transparent 55%),
                linear-gradient(160deg, rgba(10, 12, 18, 0.55) 0%, rgba(16, 19, 28, 0.5) 45%, rgba(10, 12, 18, 0.55) 100%);
            z-index: -1;
            pointer-events: none;
        }

        ::selection {
            background: #7a8a9a;
            color: #0a0c12;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #141a24;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a4454;
            border-radius: 4px;
        }

        .glass-wrapper {
            position: relative;
            z-index: 1;
            width: min(94vw, 450px);
        }

        .glass-container {
            position: relative;
            background: rgba(18, 24, 34, 0.7);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-radius: clamp(16px, 4vw, 24px);
            padding: clamp(20px, 6vw, 32px) clamp(16px, 5vw, 28px) clamp(22px, 6vw, 34px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            overflow: visible;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .glass-container::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: url('profiledeco.png') center/cover no-repeat;
            background-size: 100% 100%;
            opacity: 0.85;
            z-index: -1;
            pointer-events: none;
            border-radius: clamp(18px, 4.5vw, 28px);
        }

        .glass-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.02) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 24px;
            z-index: 0;
        }

        .profile-section {
            text-align: center;
            margin-bottom: clamp(16px, 5vw, 22px);
            margin-top: clamp(10px, 3vw, 16px);
            position: relative;
            z-index: 1;
        }

        .avatar-container {
            --avatar-size: clamp(64px, 18vw, 80px);
            position: relative;
            width: var(--avatar-size);
            height: var(--avatar-size);
            margin: 0 auto clamp(14px, 4vw, 18px);
            overflow: visible;
        }

        .avatar-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a3444, #1a222e);
            padding: 3px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        .avatar-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            object-fit: cover;
            background: #0a0c12;
        }

        .avatar-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: calc(var(--avatar-size) * 1.3);
            height: calc(var(--avatar-size) * 1.3);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            opacity: 1;
        }

        .avatar-glow img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .profile-name {
            font-size: clamp(20px, 6.5vw, 28px);
            font-weight: 700;
            color: #ece8e0;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .typing-about {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(10px, 2.8vw, 12px);
            font-weight: 400;
            color: #8a9aaa;
            letter-spacing: 0.3px;
            min-height: clamp(16px, 4vw, 20px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .typing-about .cursor {
            display: inline-block;
            width: 1.5px;
            height: clamp(11px, 3vw, 14px);
            background: #8a9aaa;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.06), transparent);
            margin: clamp(14px, 4vw, 18px) 0 clamp(16px, 5vw, 22px);
            position: relative;
            z-index: 1;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: clamp(4px, 1.5vw, 8px);
            position: relative;
            z-index: 1;
            margin-bottom: clamp(12px, 3vw, 16px);
        }

        .skill-item {
            background: rgba(18, 24, 34, 0.5);
            border: 1px solid rgba(42, 52, 68, 0.3);
            border-radius: clamp(10px, 3vw, 14px);
            padding: clamp(8px, 2.5vw, 12px) clamp(4px, 1.5vw, 8px);
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }

        .skill-item:hover {
            background: rgba(26, 34, 46, 0.7);
            border-color: rgba(90, 106, 122, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .skill-item img {
            width: clamp(20px, 6vw, 28px);
            height: clamp(20px, 6vw, 28px);
            object-fit: contain;
        }

        .social-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 3vw, 16px);
            position: relative;
            z-index: 1;
            padding: clamp(4px, 1.5vw, 8px) 0;
        }

        .social-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(36px, 10vw, 44px);
            height: clamp(36px, 10vw, 44px);
            border-radius: 50%;
            background: rgba(18, 24, 34, 0.5);
            border: 1px solid rgba(42, 52, 68, 0.3);
            color: #8a9aaa;
            transition: all 0.25s ease;
            text-decoration: none;
            flex-shrink: 0;
        }

        .social-item:hover {
            background: rgba(26, 34, 46, 0.8);
            border-color: rgba(90, 106, 122, 0.6);
            color: #ece8e0;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .social-item svg {
            width: clamp(18px, 5vw, 22px);
            height: clamp(18px, 5vw, 22px);
            fill: currentColor;
        }

        .music-player {
            position: relative;
            z-index: 1;
            background: rgba(18, 24, 34, 0.5);
            border: 1px solid rgba(42, 52, 68, 0.3);
            border-radius: clamp(12px, 3.5vw, 16px);
            padding: clamp(12px, 3vw, 16px);
            margin-top: clamp(10px, 2.5vw, 14px);
            backdrop-filter: blur(4px);
        }

        .music-player .player-top {
            display: flex;
            align-items: center;
            gap: clamp(10px, 2.5vw, 14px);
        }

        .music-player .cover {
            width: clamp(44px, 12vw, 52px);
            height: clamp(44px, 12vw, 52px);
            border-radius: 8px;
            flex-shrink: 0;
            overflow: hidden;
            background: #1a222e;
            position: relative;
        }

        .music-player .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .music-player .cover img.active {
            opacity: 1;
        }

        .music-player .track-info {
            flex: 1;
            min-width: 0;
        }

        .music-player .track-name {
            font-size: clamp(12px, 3.2vw, 14px);
            font-weight: 600;
            color: #ece8e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .music-player .track-artist {
            font-size: clamp(9px, 2.2vw, 10px);
            color: #6a7a8a;
            font-weight: 400;
            line-height: 1.3;
        }

        .music-player .controls {
            display: flex;
            align-items: center;
            gap: clamp(4px, 1.2vw, 8px);
            flex-shrink: 0;
        }

        .music-player .controls button {
            background: rgba(26, 34, 46, 0.6);
            border: 1px solid rgba(42, 52, 68, 0.3);
            border-radius: 50%;
            width: clamp(28px, 7vw, 34px);
            height: clamp(28px, 7vw, 34px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b0c0ce;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
            flex-shrink: 0;
        }

        .music-player .controls button:hover {
            background: rgba(42, 52, 68, 0.6);
            border-color: rgba(90, 106, 122, 0.5);
            transform: scale(1.08);
        }

        .music-player .controls button:active {
            transform: scale(0.95);
        }

        .music-player .controls button svg {
            width: clamp(12px, 3.2vw, 15px);
            height: clamp(12px, 3.2vw, 15px);
            fill: currentColor;
        }

        .music-player .player-bottom {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 12px);
            margin-top: clamp(10px, 2.5vw, 12px);
        }

        .music-player .time {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(8px, 2vw, 9.5px);
            color: #6a7a8a;
            font-weight: 400;
            min-width: clamp(28px, 7vw, 34px);
            text-align: center;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .music-player .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(42, 52, 68, 0.5);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            min-width: 0;
        }

        .music-player .progress-bar .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5a6a7a, #8a9aaa);
            border-radius: 4px;
            transition: width 0.1s linear;
            pointer-events: none;
        }

        .music-player .volume-wrap {
            display: flex;
            align-items: center;
            gap: clamp(4px, 1vw, 6px);
            flex-shrink: 0;
        }

        .music-player .volume-wrap svg {
            width: clamp(12px, 3vw, 14px);
            height: clamp(12px, 3vw, 14px);
            fill: #6a7a8a;
            flex-shrink: 0;
        }

        .music-player .volume-slider {
            width: clamp(40px, 10vw, 60px);
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(42, 52, 68, 0.5);
            border-radius: 2px;
            outline: none;
            flex-shrink: 0;
            cursor: pointer;
        }

        .music-player .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #8a9aaa;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .music-player .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .music-player .volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #8a9aaa;
            cursor: pointer;
            border: none;
        }

        .music-player .playlist {
            margin-top: clamp(10px, 2.5vw, 12px);
            padding-top: clamp(10px, 2.5vw, 12px);
            border-top: 1px solid rgba(42, 52, 68, 0.3);
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: clamp(120px, 30vw, 160px);
            overflow-y: auto;
        }

        .music-player .playlist::-webkit-scrollbar {
            width: 3px;
        }
        .music-player .playlist::-webkit-scrollbar-track {
            background: transparent;
        }
        .music-player .playlist::-webkit-scrollbar-thumb {
            background: rgba(90, 106, 122, 0.5);
            border-radius: 3px;
        }

        .music-player .playlist-item {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 10px);
            padding: clamp(5px, 1.5vw, 7px) clamp(6px, 1.5vw, 8px);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .music-player .playlist-item:hover {
            background: rgba(42, 52, 68, 0.4);
        }

        .music-player .playlist-item.active {
            background: rgba(42, 52, 68, 0.6);
        }

        .music-player .playlist-item .pl-cover {
            width: clamp(28px, 7vw, 32px);
            height: clamp(28px, 7vw, 32px);
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background: #1a222e;
        }

        .music-player .playlist-item .pl-info {
            flex: 1;
            min-width: 0;
        }

        .music-player .playlist-item .pl-name {
            font-size: clamp(10px, 2.6vw, 12px);
            font-weight: 500;
            color: #d0d8e2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .music-player .playlist-item.active .pl-name {
            color: #ece8e0;
            font-weight: 600;
        }

        .music-player .playlist-item .pl-artist {
            font-size: clamp(8px, 2vw, 9.5px);
            color: #6a7a8a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .music-player .playlist-item .pl-status {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #8a9aaa;
        }

        .music-player .playlist-item .pl-status svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .music-player .playlist-item.active .pl-status .playing-icon {
            display: flex;
        }

        .music-player .playlist-item .pl-status .playing-icon {
            display: none;
            gap: 2px;
            align-items: flex-end;
            height: 12px;
        }

        .music-player .playlist-item .pl-status .playing-icon span {
            display: block;
            width: 2px;
            background: #8a9aaa;
            border-radius: 1px;
            animation: eq 0.8s ease-in-out infinite;
        }

        .music-player .playlist-item .pl-status .playing-icon span:nth-child(1) {
            height: 40%;
            animation-delay: 0s;
        }
        .music-player .playlist-item .pl-status .playing-icon span:nth-child(2) {
            height: 80%;
            animation-delay: 0.2s;
        }
        .music-player .playlist-item .pl-status .playing-icon span:nth-child(3) {
            height: 55%;
            animation-delay: 0.4s;
        }

        @keyframes eq {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }

        .footer-note {
            text-align: center;
            color: #3a4a5a;
            font-size: clamp(8px, 2vw, 9px);
            padding-top: clamp(14px, 4vw, 20px);
            letter-spacing: 1.5px;
            font-weight: 300;
            margin-top: 6px;
            border-top: 1px solid rgba(26, 34, 46, 0.4);
            position: relative;
            z-index: 1;
        }

        @media (max-width: 340px) {
            .skills-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .social-grid {
                gap: 8px;
            }
        }

        @media (max-height: 620px) and (max-width: 500px) {
            body {
                align-items: flex-start;
                padding-top: 20px;
                padding-bottom: 20px;
            }
        }
    </style>
</head>

        <div class="glass-container">

                <div class="skill-item"><img src="https://skillicons.dev/icons?i=vscode" alt="VSCode" /></div>

    <audio id="bg-music"></audio>

    <script>
        const video = document.getElementById('bg-video');
        const audio = document.getElementById('bg-music');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const typingText = document.getElementById('typingText');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const trackName = document.getElementById('trackName');
        const trackArtist = document.getElementById('trackArtist');
        const coverImgs = document.querySelectorAll('#nowPlayingCover img');
        const playlistItems = document.querySelectorAll('.playlist-item');

        const playlist = [
            { src: '1.mp3', cover: '1.webp', name: 'Nyx Playlist', artist: '24/7' },
            { src: '2.mp3', cover: 'profile.png', name: 'Nyx Playlist', artist: 'Aura' },
            { src: '3.mp3', cover: 'profile.png', name: 'Nyx Playlist', artist: 'Dostam Hastan' },
            { src: '4.mp3', cover: 'profile.png', name: 'Nyx Playlist', artist: 'Chera Rafti' }
        ];

        let currentIndex = 0;
        let isPlaying = true;

        video.volume = 0;
        video.loop = true;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;

        audio.volume = 0.6;

        function loadTrack(index, autoplay) {
            currentIndex = index;
            const track = playlist[index];
            audio.src = track.src;
            trackName.textContent = track.name;
            trackArtist.textContent = track.artist;

            coverImgs.forEach((img, i) => {
                img.classList.toggle('active', i === index);
            });

            playlistItems.forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });

            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            durationEl.textContent = '0:00';

            if (autoplay) {
                audio.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                }).catch(() => {});
            }
        }

        video.play().catch(() => {});

        loadTrack(0, true);
        audio.play().catch(() => {
            document.addEventListener('click', function playOnClick() {
                video.play().catch(() => {});
                audio.play().catch(() => {});
                document.removeEventListener('click', playOnClick);
            }, { once: true });
        });

        audio.addEventListener('ended', function() {
            const nextIndex = (currentIndex + 1) % playlist.length;
            loadTrack(nextIndex, true);
        });

        function formatTime(sec) {
            if (isNaN(sec) || !isFinite(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function updateProgress() {
            if (audio.duration && isFinite(audio.duration)) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationEl.textContent = formatTime(audio.duration);
            }
        }

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', updateProgress);
        audio.addEventListener('durationchange', updateProgress);

        progressBar.addEventListener('click', function(e) {
            if (!audio.duration || !isFinite(audio.duration)) return;
            const rect = progressBar.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
            updateProgress();
        });

        playPauseBtn.addEventListener('click', function() {
            if (audio.paused) {
                audio.play().catch(() => {});
                playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                isPlaying = true;
            } else {
                audio.pause();
                playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                isPlaying = false;
            }
        });

        volumeSlider.addEventListener('input', function() {
            audio.volume = parseFloat(this.value);
        });

        playlistItems.forEach(item => {
            item.addEventListener('click', function() {
                const idx = parseInt(this.dataset.index);
                if (idx === currentIndex && !audio.paused) {
                    audio.pause();
                    playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
                    isPlaying = false;
                } else {
                    loadTrack(idx, true);
                }
            });
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && audio.paused && isPlaying) {
                audio.play().catch(() => {});
            }
            if (!document.hidden) {
                video.play().catch(() => {});
            }
        });

        const phrases = [
            "Full Stack Developer",
            "Java Architect",
            "Minecraft Developer",
            "DevOPS Engineer",
            "Redis & MongoDB Engineer",
            "Develop & Coffee"
        ];

        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function typeLoop() {
            const current = phrases[phraseIndex];

            if (!isDeleting) {
                typingText.textContent = current.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === current.length) {
                    isDeleting = true;
                    setTimeout(typeLoop, 1600);
                    return;
                }
                setTimeout(typeLoop, 70);
            } else {
                typingText.textContent = current.substring(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) {
                    isDeleting = false;
                    phraseIndex = (phraseIndex + 1) % phrases.length;
                    setTimeout(typeLoop, 400);
                    return;
                }
                setTimeout(typeLoop, 40);
            }
        }

        typeLoop();
        
    </script>
